---

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: yes

- name: Pull kubeadm config images
  command: kubeadm config images pull
  register: kubernetes_kubelet_output

- name: debug output
  ansible.builtin.debug:
    msg: "kubelet systemctl: {{ kubernetes_kubelet_output.stdout }}"

- name: Check if Kubernetes cluster is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubernetes_admin_conf

- name: Reset Kubernetes component
  command: "kubeadm reset --force"
  register: kubernetes_reset_cluster
  when: not kubernetes_admin_conf.stat.exists

- name: Pause for 10 seconds to make sure reset is complete
  ansible.builtin.pause:
    seconds: 10
  when: not kubernetes_admin_conf.stat.exists

- name: debug output
  ansible.builtin.debug:
    msg: "kubeadm init: stderr: {{ kubernetes_reset_cluster.stderr_lines }}  stdout: {{ kubernetes_reset_cluster.stdout_lines }}"

# #   #command: firewall-cmd --reload
# # - name: 2.6.reload_firewall
# #   command: systemctl start firewalld.service

- name: create symlinks for containerd
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  with_items:
    - src: /data/run/containerd
      dest: /run/containerd

- name: Init Kubernetes cluster
  shell: |
    kubeadm init --service-cidr {{ service_cidr }} \
                 --pod-network-cidr {{ pod_network_cidr }} \
                 --token {{ token }} \
                 --control-plane-endpoint {{ master_ip }} \
                 --cri-socket=/data/run/containerd/containerd.sock

  args:
    chdir: $HOME
  register: kubernetes_init_cluster
  when: not kubernetes_admin_conf.stat.exists
  environment:
    no_proxy: "$no_proxy,.svc,.svc.cluster.local"

- name: debug output
  ansible.builtin.debug:
    msg: "Init Kubernetes Cluster: stderr: {{ kubernetes_init_cluster.stderr_lines }} stdout: {{ kubernetes_init_cluster.stdout_lines }}"

