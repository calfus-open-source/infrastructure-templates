---

- name: Ensure the namespace exists
  become: yes
  become_user: kube
  command: kubectl get namespace {{ namespace }}
  register: kubernetes_namespace_check
  failed_when: false
  changed_when: false

- name: Create the namespace if it does not exist
  become: yes
  become_user: kube
  command: kubectl create namespace {{ namespace }}
  when: kubernetes_namespace_check.rc != 0
  changed_when: true

- name: Get ECR login password
  become: yes
  become_user: kube
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
  command: aws ecr get-login-password --region {{ aws_region }}
  register: kubernetes_ecr_login_password
  changed_when: false

- name: Delete existing Kubernetes secret
  become: yes
  become_user: kube
  command: kubectl delete secret -n {{ namespace }} rcred
  failed_when: false
  changed_when: "'deleted' in kubernetes_delete_secret.stdout or kubernetes_delete_secret.rc == 0"
  register: kubernetes_delete_secret

- name: Create new Kubernetes secret
  become: yes
  become_user: kube
  command: kubectl create secret docker-registry rcred --docker-server={{ accountId }}.dkr.ecr.{{ aws_region }}.amazonaws.com --docker-username=AWS --namespace={{ namespace }} --docker-password={{ kubernetes_ecr_login_password.stdout }}
  failed_when: false
  changed_when: true

- name: Find YAML files
  find:
    paths: "../../../../gitops/{{ gitops_base_path }}"
    patterns: "*.yaml"
  register: kubernetes_found_files
  delegate_to: localhost
  become: no

- name: Copy multiple files from localhost to remote machine
  copy:
    src: "{{ item }}"
    dest: "/tmp/"
    mode: "0644"
  with_fileglob:
    - "../../../../gitops/{{ gitops_base_path }}/*.yml"
  delegate_to: localhost
  become: no

- name: Find YAML files on localhost
  find:
    paths: "../../../../gitops/{{ gitops_base_path }}/"
    patterns: "*.yml"
  delegate_to: localhost
  register: kubernetes_found_files
  become: no

- name: Copy YAML files to remote machine
  copy:
    src: "{{ item.path }}"
    dest: "/tmp/{{ item.path | basename }}"
    mode: "0644"
  with_items: "{{ kubernetes_found_files.files }}"
  when: kubernetes_found_files.matched > 0

- name: Apply Kubernetes configurations
  become: yes
  become_user: kube
  command: kubectl apply -f "/tmp/{{ item.path | basename }}"
  args:
    chdir: /tmp/
  loop: "{{ kubernetes_found_files.files }}"
  changed_when: "'created' in kubernetes_apply_configs.stdout or 'configured' in kubernetes_apply_configs.stdout"
  register: kubernetes_apply_configs

- name: Clean up temporary files
  file:
    path: "/tmp/{{ item.path | basename }}"
    state: absent
  loop: "{{ kubernetes_found_files.files }}"
