---
- name: Create containerd config file
  file:
    path: "/etc/modules-load.d/containerd.conf"
    state: "touch"
    mode: "0644"

- name: Add conf for containerd
  blockinfile:
    path: "/etc/modules-load.d/containerd.conf"
    block: |
      overlay
      br_netfilter

- name: Load kernel modules
  shell: |
    sudo modprobe overlay
    sudo modprobe br_netfilter
  changed_when: false

- name: Set system configurations for Kubernetes networking
  file:
    path: "/etc/sysctl.d/99-kubernetes-cri.conf"
    state: "touch"
    mode: "0644"

- name: Add configuration for containerd networking
  blockinfile:
    path: "/etc/sysctl.d/99-kubernetes-cri.conf"
    block: |
      vm.swappiness = 0
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-ip6tables = 1

- name: Apply new system settings
  command: sudo sysctl --system
  changed_when: "'Applying' in kubernetes_sysctl_apply.stdout or kubernetes_sysctl_apply.rc == 0"
  register: kubernetes_sysctl_apply

- name: Disable swappiness and configure sysctl
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  with_items:
    - { name: 'vm.swappiness', value: '0' }
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }

- name: Create necessary directories for containerd
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - /etc/containerd
    - /data/lib/containerd
    - /data/run/containerd
    - /logs/syslogs
    - /var/log/pods

- name: Check if /var/lib/containerd is not a symlink
  stat:
    path: /var/lib/containerd
  register: kubernetes_lib_containerd_stat

- name: Check if /run/containerd is not a symlink
  stat:
    path: /run/containerd
  register: kubernetes_run_containerd_stat

- name: Remove /var/lib/containerd if it is not a symlink
  file:
    path: /var/lib/containerd
    state: absent
    force: yes
  when: kubernetes_lib_containerd_stat.stat.exists and not kubernetes_lib_containerd_stat.stat.islnk

- name: Remove /run/containerd if it is not a symlink
  file:
    path: /run/containerd
    state: absent
    force: yes
  when: kubernetes_run_containerd_stat.stat.exists and not kubernetes_run_containerd_stat.stat.islnk

- name: Create symlinks for containerd
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
  with_items:
    - src: /data/lib/containerd
      dest: /var/lib/containerd
    - src: /data/run/containerd
      dest: /run/containerd
    - src: /logs/syslogs
      dest: /var/log/pods/syslogs

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
  register: kubernetes_containerd_install

- name: Debug output of containerd installation
  debug:
    msg: "Containerd install: {{ kubernetes_containerd_install }}"

- name: Configure containerd
  shell: |
    set -o pipefail
    containerd config default | sudo tee /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
    sed -i 's/\/var\/lib\/containerd/\/data\/lib\/containerd/g' /etc/containerd/config.toml
    sed -i 's/\/run\/containerd/\/data\/run\/containerd/g' /etc/containerd/config.toml
    systemctl restart containerd
    systemctl enable containerd
  args:
    executable: /bin/bash
  register: kubernetes_containerd_config
  changed_when: true

- name: Create crictl.yaml file
  file:
    path: "/etc/crictl.yaml"
    state: "touch"
    mode: "0644"

- name: Configure crictl.yaml
  blockinfile:
    path: "/etc/crictl.yaml"
    block: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 2
      debug: false
      pull-image-on-create: false

- name: Disable swap
  shell: |
    swapoff -a
    sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
  changed_when: true
